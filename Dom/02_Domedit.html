<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
        <div class="day">Friday</div>
    </div>
</body>
<script>
    const parent=document.querySelector('.parent')
    console.log(parent);
    console.log(parent.children);
    console.log(parent.children[1].innerHTML); // tuesday
    console.log(parent.children[4].innerHTML); // friday
    //console.log(parent.children[6].innerHTML); cannot read it
    for(let i=0; i<parent.children.length;i++){
        // console.log(parent.children[i].innerHTML); // printed all 
    }

    parent.children[4].style.color="orange"
    console.log(parent.firstElementChild); // made the color orange
    console.log(parent.lastElementChild);
    
    const dayone=document.querySelector('.day')
    console.log(dayone);
    console.log(dayone.parentElement);
    console.log(dayone.nextElementSibling);
    
    console.log("Nodes : ",parent.childNodes); // here we get to know  blank  lines  are also counted as nodes 
    
    

    
    
</script>
</html>
