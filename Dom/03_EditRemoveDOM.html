<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul class="language">
        <li>
            Javascript
        </li>
    </ul>
    
</body>
<script>
    function addlanguage(language){
        const li=document.createElement('li')
        li.innerHTML=`${language}`
        document.querySelector('.language').appendChild(li)
    }
    addlanguage("python")
    addlanguage("typeScript")

    function addoptiLanguage(language){
        const li =document.createElement('li')
        li.appendChild(document.createTextNode(language))
        document.querySelector('.language').appendChild(li)
    }
    addoptiLanguage('golaang')

    // Edit 
    const secondlanguage=document.querySelector("li:nth-child(2)")
    secondlanguage.innerHTML="java" // the inner HTML will traverse full child node 
    // Second method
    const newli=document.querySelector("li:nth-child(2)")
    newli.textContent="Java"
    secondlanguage.replaceWith(newli)


    //edit
    const firstLang=document.querySelector("li:first-child")
    firstLang.outerHTML='<li>TypeScript</li>'

    // remove
    const lastlang=document.querySelector('li:last-child')
    lastlang.remove()
</script>
</html>
